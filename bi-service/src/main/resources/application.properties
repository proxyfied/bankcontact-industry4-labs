server.port=${BI_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankcontact_lab2}
spring.datasource.username=${DB_USER:bankcontact}
spring.datasource.password=${DB_PASSWORD:bankcontact_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
bi.cors-origins=${BI_CORS_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080}
