name: bankcontact-prod
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankcontact_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Generate deploy/.env first}
      APP_DB_USER: bankcontact_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate deploy/.env first}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [data]
    mem_limit: 512m
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankcontact_prod"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  app:
    build: .
    image: bankcontact-security:lab8
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/bankcontact_prod
      DB_USER: bankcontact_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Generate deploy/.env first}
      COOKIE_SECURE: "true"
      BANKCONTACT_URL: /
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0 -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
    depends_on:
      db:
        condition: service_healthy
    networks: [application, data]
    mem_limit: 1024m
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 6s
      start_period: 45s
      retries: 15
    logging: *logs
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/runtime/nginx:/etc/nginx/templates:ro
      - ./deploy/runtime/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/runtime/acme:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [edge, application]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *logs
  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - ./deploy/runtime/letsencrypt:/etc/letsencrypt
      - ./deploy/runtime/acme:/var/www/certbot
    networks: [edge]
volumes:
  pgdata:
networks:
  edge:
  application:
    internal: true
  data:
    internal: true
