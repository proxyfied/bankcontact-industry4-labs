spring.application.name=bankcontact
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankcontact_lab2}
spring.datasource.username=${DB_USER:bankcontact}
spring.datasource.password=${DB_PASSWORD:bankcontact_dev}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.main.web-application-type=none
