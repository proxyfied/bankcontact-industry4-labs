server.port=${SECURITY_PORT:8084}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankcontact_lab2}
spring.datasource.username=${DB_USER:bankcontact}
spring.datasource.password=${DB_PASSWORD:bankcontact_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=20m
server.servlet.session.cookie.name=BANKCONTACT_AUTH
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
bankcontact.url=${BANKCONTACT_URL:http://localhost:8080}
