name: Verify PostgreSQL ORM
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bankcontact_lab2
          POSTGRES_USER: bankcontact
          POSTGRES_PASSWORD: bankcontact_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankcontact -d bankcontact_lab2"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - name: Export schema and validation
        env:
          PGPASSWORD: bankcontact_dev
        run: |
          mkdir -p evidence
          docker exec ${{ job.services.postgres.id }} pg_dump -U bankcontact -d bankcontact_lab2 --schema-only > evidence/schema.sql
          docker exec -i ${{ job.services.postgres.id }} psql -U bankcontact -d bankcontact_lab2 < sql/verify.sql > evidence/database-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-validation
          path: |
            target/surefire-reports/
            evidence/
