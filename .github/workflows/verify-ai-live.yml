name: Lab 5 - Real GPT-4o-mini verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-ai-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build AI service
        run: mvn -B -f ai-articles/pom.xml -DskipTests package
      - name: Install browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: One real generation using the repository secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.openai.com
          AI_TEST_MODE: 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Add repository Actions secret OPENAI_API_KEY, then run this workflow again.'
            exit 1
          fi
          mkdir -p evidence/lab5-live
          java -jar ai-articles/target/bankcontact-ai-articles-0.0.5-SNAPSHOT.jar > /tmp/bankcontact-ai-live.log 2>&1 &
          app_pid=$!
          trap 'python "$GITHUB_WORKSPACE/ai-articles/tools/collect_ai_diagnostics.py" /tmp/bankcontact-ai-live.log "$GITHUB_WORKSPACE/evidence/lab5-live/provider-diagnostics.json"; kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8082/articles > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo 'AI application startup failed.'; exit 1; fi
          cd frontend
          npx playwright test --config playwright.ai-live.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab5-real-gpt4o-mini-verification
          retention-days: 14
          if-no-files-found: ignore
          path: evidence/lab5-live/
