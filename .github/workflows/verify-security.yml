name: Verify Lab 7 Spring Security and sessions
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bankcontact_lab2
          POSTGRES_USER: bankcontact
          POSTGRES_PASSWORD: bankcontact_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bankcontact -d bankcontact_lab2"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify security with PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/bankcontact_lab2
          TEST_DB_USER: bankcontact
          TEST_DB_PASSWORD: bankcontact_dev
        run: mvn -B -f security-service/pom.xml verify
      - name: Install browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify real browser sessions and role pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/lab7
          java -jar security-service/target/bankcontact-security-0.0.7-SNAPSHOT.jar --spring.profiles.active=demo > /tmp/bankcontact-security.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8084/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo 'Security service failed to start.'; exit 1; fi
          cd frontend
          npx playwright test --config playwright.security.config.js
      - name: Export schema and non-sensitive validation
        if: success()
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U bankcontact -d bankcontact_lab2 --schema-only -t sec_users -t sec_roles -t sec_user_roles > evidence/lab7/schema.sql
          docker exec ${{ job.services.postgres.id }} psql -U bankcontact -d bankcontact_lab2 -c "SELECT u.username, bool_and(left(u.password,7) = chr(36) || '2a' || chr(36) || '12' || chr(36)) AS bcrypt_cost_12, string_agg(r.name, ', ' ORDER BY r.name) AS roles FROM sec_users u JOIN sec_user_roles ur ON ur.user_id=u.id JOIN sec_roles r ON r.id=ur.role_id GROUP BY u.username ORDER BY u.username;" > evidence/lab7/database-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab7-security-postgresql-verification
          path: |
            security-service/target/surefire-reports/*.txt
            evidence/lab7/
