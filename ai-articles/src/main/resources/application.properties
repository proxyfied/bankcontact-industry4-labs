spring.application.name=bankcontact-ai-articles
spring.main.web-application-type=servlet
server.port=${AI_PORT:8082}
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0
spring.ai.openai.chat.options.max-tokens=3000
spring.ai.openai.chat.options.response-format.type=JSON_OBJECT
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.retry.max-attempts=1
app.ai.test-mode=${AI_TEST_MODE:false}
app.bankcontact-url=${BANKCONTACT_URL:http://localhost:8080/#/}
server.error.include-message=never
